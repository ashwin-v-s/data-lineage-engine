name: contract
on:
  pull_request:
  push:
jobs:
  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Regenerate OpenAPI snapshot from the installed package versions
        run: python scripts/export_openapi.py && cp docs/openapi.json contracts/api/openapi.json
      - name: OpenAPI contract drift (must be zero after regeneration)
        run: python scripts/check_openapi_drift.py
      - name: AI CI Healer
        if: failure()
        uses: mariorazo97/ai-ci-healer@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

