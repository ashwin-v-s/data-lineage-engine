name: ci
on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Import boundaries (leakage and independence rules)
        run: python scripts/check_import_boundaries.py
      - name: API application import
        run: python -c "from backend.api.index import app; assert app"
      - name: Tests
        run: python -m pytest -q
