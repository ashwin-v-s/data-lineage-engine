name: live-smoke

# Manually-triggered live smoke test against a deployed Kairos environment.
#
# This workflow is intentionally NOT part of the default CI
# (.github/workflows/ci.yml): it talks to a real deployment and to the shared
# Supabase project, so it runs only on demand and on a nightly schedule. It
# calls scripts/check_deployment.py, which verifies GET {base-url}/health and
# that the required deployment environment variables are present.
on:
  # Run from the GitHub UI: Actions -> live-smoke -> Run workflow.
  workflow_dispatch:
  # Optional nightly run at 03:00 UTC.
  schedule:
    - cron: "0 3 * * *"

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    # Required repository secrets (Settings -> Secrets and variables -> Actions):
    #   KAIROS_DEPLOY_BASE_URL    deployed API base serving GET /health,
    #                             e.g. https://kairos.example.com/api/v1
    #   DATABASE_URL              Supabase transaction-pooler URI (secret)
    #   SUPABASE_URL              public Supabase project URL
    #   SUPABASE_PUBLISHABLE_KEY  Supabase publishable/anon key
    #   FRONTEND_ORIGIN           exact deployed frontend origin (CORS)
    #
    # Secrets/vars are passed through env: and never inlined into commands.
    env:
      KAIROS_DEPLOY_BASE_URL: ${{ secrets.KAIROS_DEPLOY_BASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Python project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Live deployment smoke test
        run: python scripts/check_deployment.py --base-url "$KAIROS_DEPLOY_BASE_URL"
