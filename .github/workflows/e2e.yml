name: e2e

# Browser-level Playwright smoke coverage for the application shell.
#
# Separate from ci.yml: this adds a headless Chromium run over the Vite-served
# shell (frontend/index.html -> src/main.jsx + personalization.js). It needs no
# backend or Supabase instance — the shell smoke suite asserts only on
# deterministically-rendered markup and the absence of uncaught page errors.
on:
  pull_request:
  push:
jobs:
  shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright shell smoke suite
        working-directory: frontend
        run: npm run test:e2e
