# Kairos Research Protocol v1
# Pack Section 42.  MUST be committed before the full experiment run.
# Status: PARTIAL — M5-owned fields filled 2026-11-02; team fields still TBD.
#
# Frozen values are marked LOCKED.
# Values awaiting team decision are marked TBD + decision reference.
# Plumbing-only defaults are marked PLUMBING.
# Values filled by M5 (Pranav) on 2026-11-02 are marked M5-DECIDED.
#
# Rules:
#   - Do not invent a TBD value to make this file look complete.
#   - A real (non-plumbing) experiment run must fail if any required field is TBD.
#   - Changing a LOCKED value requires a decision record in docs/DECISION_LOG.md.

protocol_version: "1.0-partial"           # bumped from skeleton on 2026-11-02

# ---------------------------------------------------------------------------
# Benchmark
# ---------------------------------------------------------------------------
benchmark_version: "v0.2-dev"             # M5-DECIDED: updated 2026-11-03 with NOT_PROPAGATED cases W11-W13
benchmark_path: "research/benchmarks/"
sql_subset:                               # M5-DECIDED: from ingestion/sql/SUPPORT_MATRIX.md
  - PROJECTION
  - PROJECTION_ARITHMETIC
  - CASE_WHEN
  - AGGREGATE_SUM
  - AGGREGATE_COUNT_STAR
  - JOIN_INNER
  - SELECT_STAR
  - WHERE_FILTER
  - COALESCE
splits:
  development: [W01, W02, W03, W04, W05, W11]  # M5-DECIDED: W11 added (NOT_PROPAGATED CASE_WHEN)
  validation: [W06, W07, W08, W12, W13]          # M5-DECIDED: W12/W13 added (NOT_PROPAGATED COALESCE, JOIN)
  held_out: [W09, W10]                            # M5-DECIDED: unchanged — DO NOT TUNE

# ---------------------------------------------------------------------------
# Semantics and prediction unit
# ---------------------------------------------------------------------------
contribution_semantics: where-provenance  # M5-DECIDED: column-level where-provenance
                                          # (D-11: which source rows contributed to target)
prediction_unit_universe: static-plus-positive
                                          # M5-DECIDED (D-12): union of static candidates
                                          # and pairs with positive runtime evidence

# ---------------------------------------------------------------------------
# Loss model
# ---------------------------------------------------------------------------
loss:
  mechanisms: [mcar, operator, dataset, branch, complete_run, correlated]
  levels: [0, 10, 30, 50, 70, 90]        # LOCKED (Pack Section 22)
  master_seed: 42                         # M5-DECIDED: reproducible default seed
  replicates: 3                           # M5-DECIDED: 3 seeds per cell (1, 7, 42)
  seeds: [1, 7, 42]                       # M5-DECIDED: explicit seed list
  rounding_rule: round-half-up            # M5-DECIDED: standard rounding for event counts
  zero_arrival_semantics: no-evidence     # M5-DECIDED (zero-arrival option B):
                                          # 0% loss = all events present;
                                          # a run with 0 events produces no evidence
                                          # records (not a negative evaluation)

# ---------------------------------------------------------------------------
# Methods
# ---------------------------------------------------------------------------
baselines: [B1, B2, B3, B4, B5]          # LOCKED names (Pack Section 23)
proposed: proposed                         # the FourStateEngine

# ---------------------------------------------------------------------------
# Metrics
# ---------------------------------------------------------------------------
metrics:
  primary: false_refutation               # M5-DECIDED (D-05): central research metric —
                                          # rate at which PROPAGATED truth is predicted
                                          # REFUTED_FOR_RUN; must be lower than B2
  secondary:
    - false_observation
    - correct_refutation
    - precision_strict
    - precision_lenient
    - recall_strict
    - recall_lenient
    - unknown_rate
    - possible_rate
    - committed_accuracy
    - query_exact_strict
    - query_jaccard_strict
  confidence_interval: bootstrap-95       # M5-DECIDED (D-08): 95% bootstrap CI,
                                          # 1000 resamples, percentile method
  na_rule: "zero_denominator_is_NA"       # LOCKED (implemented in metrics.py)
  granularity_separation: true            # LOCKED: DATASET and COLUMN scored separately

# ---------------------------------------------------------------------------
# Evaluation rules
# ---------------------------------------------------------------------------
aggregation: macro-average-over-cases    # M5-DECIDED (D-05): macro-average across cases
                                         # at each loss level; do not pool across levels
stopping_rule: |                         # M5-DECIDED (D-05 / K1-K8):
  Supported:      proposed false_refutation < B2 false_refutation at all loss levels,
                  AND proposed false_refutation < 0.10 at loss level 0
  Inconclusive:   proposed false_refutation < B2 at some but not all loss levels
  Rejected:       proposed false_refutation >= B2 false_refutation at loss level 0
exclusion_rules: |                       # M5-DECIDED:
  Cases with parser_status=UNSUPPORTED are excluded from scoring (counted in diagnostics).
  Cases with parser_status=PARTIAL are included but flagged.
  A case is excluded if ground truth cannot be determined (documented in findings).

# ---------------------------------------------------------------------------
# Kill criteria K1–K8 (D-01, Pack Section 26)
# ---------------------------------------------------------------------------
kill_criteria:                           # M5-DECIDED: conservative thresholds for a
                                         # 10-case SQL-subset benchmark
  K1_false_refutation_proposed_vs_B2:    # proposed must beat B2
    threshold: "proposed < B2 at level 0"
    verdict_if_failed: Rejected
  K2_false_refutation_absolute:          # must not produce false certainty
    threshold: "false_refutation <= 0.15 at level 0"
    verdict_if_failed: Rejected
  K3_false_observation_absolute:
    threshold: "false_observation <= 0.20 at level 0"
    verdict_if_failed: Inconclusive
  K4_unknown_rate_not_too_high:          # engine must commit to states
    threshold: "unknown_rate <= 0.40 at level 0"
    verdict_if_failed: Inconclusive
  K5_recall_strict_not_worse_than_B1:   # must not be worse than static-only
    threshold: "recall_strict >= B1 recall_strict at level 0"
    verdict_if_failed: Inconclusive
  K6_monotone_recall_erosion:            # recall must erode as loss increases
    threshold: "recall_strict[level=90] <= recall_strict[level=0]"
    verdict_if_failed: Inconclusive
  K7_no_false_refutation_on_zero_loss:  # at 0% loss, zero false refutations allowed
    threshold: "false_refutation == 0 at level 0"
    verdict_if_failed: Rejected
  K8_committed_accuracy_beats_B3:        # must beat naive union on committed pairs
    threshold: "committed_accuracy > B3 committed_accuracy at level 0"
    verdict_if_failed: Inconclusive

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output_format: "json"
output_path: "research/results/"

# ---------------------------------------------------------------------------
# Research integrity
# ---------------------------------------------------------------------------
ground_truth_isolation: true             # LOCKED: GT loaded only after predictions exist
no_held_out_tuning: true                 # LOCKED: do not tune on held-out cases
no_gt_in_predictor: true                 # LOCKED: engine/baselines never receive GT objects
ground_truth_provider: ReferenceInterpreterProvider
                                         # M5-DECIDED: ProvSQL downgrade per RESEARCH_LOG.md R-01
                                         # Semi-automated human-derived truth for defined SQL subset

# ---------------------------------------------------------------------------
# Environment (filled at run time by the runner)
# ---------------------------------------------------------------------------
environment:
  python_version: TBD                    # recorded at run time
  platform: TBD                          # recorded at run time
  git_sha: TBD                           # recorded at run time
  db_version: "PostgreSQL 17.6"          # M5-DECIDED: shared Supabase project (verified 2026-11-02)
  provider_version: "reference-1.0"      # M5-DECIDED: ReferenceInterpreterProvider v1.0
