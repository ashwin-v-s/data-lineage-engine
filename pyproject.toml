[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-lineage-engine"
version = "0.0.1"
description = "Kairos: bitemporal lineage engine with coverage-aware execution-conditioned reasoning (research prototype)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1,<2",
    "pydantic[email]>=2,<3",
    "sqlalchemy>=2,<3",
    "sqlglot>=26",
]

[tool.vercel]
entrypoint = "backend.api.index:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.14,<0.18",
]
# Exact versions are NOT YET FROZEN: freeze at the first working build (Pack Section 42).

[tool.setuptools.packages.find]
include = ["backend*", "contracts*", "ingestion*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Generated and vendored trees only; source trees are linted in full by CI, which
# passes an explicit path list (see .github/workflows/ci.yml).
extend-exclude = ["node_modules", "dist", "build", ".pw-browsers"]

[tool.ruff.lint]
# Deliberately narrow and high-signal: only real defects (E9 syntax/IO errors,
# pyflakes F) and import hygiene (I).  Style and modernization rules are omitted
# on purpose -- they would flag large volumes of pre-existing code owned by the
# M1-M5 workstreams, which this change must not touch.
select = ["E9", "F", "I"]
